<script>
(function(){
 const links=Array.from(document.querySelectorAll('.gallery-thumb'));
 const box=document.getElementById('gallery-lightbox');
 document.body.appendChild(box); // Keep the floating viewer outside the animated page artwork.
 const photo=box.querySelector('.lightbox-image');
 const caption=box.querySelector('.lightbox-caption');
 let current=0;
 function show(i){
   current=(i+links.length)%links.length;
   const link=links[current], img=link.querySelector('img');
   photo.src=link.dataset.full||link.href;
   photo.alt=img.alt||'Zdjęcie z galerii';
   caption.textContent=img.alt||'';
 }
 function open(i){
   show(i); box.classList.add('is-open'); box.setAttribute('aria-hidden','false');
   document.body.classList.add('lightbox-open');
   box.querySelector('.lightbox-close').focus();
 }
 function close(){
   box.classList.remove('is-open'); box.setAttribute('aria-hidden','true');
   document.body.classList.remove('lightbox-open');
   photo.removeAttribute('src');
 }
 links.forEach((link,i)=>link.addEventListener('click',e=>{e.preventDefault();open(i)}));
 box.querySelector('.lightbox-close').addEventListener('click',close);
 box.querySelector('.lightbox-prev').addEventListener('click',()=>show(current-1));
 box.querySelector('.lightbox-next').addEventListener('click',()=>show(current+1));
 box.addEventListener('click',e=>{if(e.target===box)close()});
 document.addEventListener('keydown',e=>{
   if(!box.classList.contains('is-open'))return;
   if(e.key==='Escape')close();
   if(e.key==='ArrowLeft')show(current-1);
   if(e.key==='ArrowRight')show(current+1);
 });
})();
</script>

 const photos=["https://raw.githubusercontent.com/piela44-wojciech/sokolnictwo-i-jastrzebiarstwo/main/assets/tap2_8wQ8.jpg","https://raw.githubusercontent.com/piela44-wojciech/sokolnictwo-i-jastrzebiarstwo/main/assets/tap3_8wQ8.jpg","https://raw.githubusercontent.com/piela44-wojciech/sokolnictwo-i-jastrzebiarstwo/main/assets/tap4_8wQ8.jpg","https://raw.githubusercontent.com/piela44-wojciech/sokolnictwo-i-jastrzebiarstwo/main/assets/tap5_8wQ8.jpg","https://raw.githubusercontent.com/piela44-wojciech/sokolnictwo-i-jastrzebiarstwo/main/assets/tap6_8wQ8.jpg","https://raw.githubusercontent.com/piela44-wojciech/sokolnictwo-i-jastrzebiarstwo/main/assets/tap7_8wQ8.jpg","https://raw.githubusercontent.com/piela44-wojciech/sokolnictwo-i-jastrzebiarstwo/main/assets/dora4_8wQ8.jpg","https://raw.githubusercontent.com/piela44-wojciech/sokolnictwo-i-jastrzebiarstwo/main/assets/p2_8wQ8.jpg","https://raw.githubusercontent.com/piela44-wojciech/sokolnictwo-i-jastrzebiarstwo/main/assets/p6_8wQ8.jpg","https://raw.githubusercontent.com/piela44-wojciech/sokolnictwo-i-jastrzebiarstwo/main/assets/p8_8wQ8.jpg","https://raw.githubusercontent.com/piela44-wojciech/sokolnictwo-i-jastrzebiarstwo/main/assets/p9_8wQ8.jpg","https://raw.githubusercontent.com/piela44-wojciech/sokolnictwo-i-jastrzebiarstwo/main/assets/p10_8wQ8.jpg","https://raw.githubusercontent.com/piela44-wojciech/sokolnictwo-i-jastrzebiarstwo/main/assets/super1_8wQ8.jpg","https://raw.githubusercontent.com/piela44-wojciech/sokolnictwo-i-jastrzebiarstwo/main/assets/super2_8wQ8.jpg","https://raw.githubusercontent.com/piela44-wojciech/sokolnictwo-i-jastrzebiarstwo/main/assets/super3_8wQ8.jpg","https://raw.githubusercontent.com/piela44-wojciech/sokolnictwo-i-jastrzebiarstwo/main/assets/tap1_8wQ8.jpg"]; let previous=0;
 window.setInterval(()=>{let next=Math.floor(Math.random()*photos.length);if(photos.length>1)while(next===previous)next=Math.floor(Math.random()*photos.length);previous=next;image.classList.add('is-changing');const nextImage=new Image();nextImage.onload=()=>{image.src=photos[next];image.classList.remove('is-changing')};nextImage.onerror=()=>image.classList.remove('is-changing');nextImage.src=photos[next]},30000);
})();

<script>
(() => {
  const box = document.querySelector('.falconry-quote .quote-text');
  if (!box) return;
  const quotes = [
    "Sokół uczy cierpliwości, a las — pokory.",
    "Prawdziwy łowca zna wartość ciszy.",
    "W sokolnictwie zaufanie jest ważniejsze niż siła.",
    "Szanuj zwierzynę, zanim podniesiesz broń.",
    "Tradycja łowiecka zaczyna się od szacunku do przyrody.",
    "Dobry sokolnik najpierw obserwuje, potem działa.",
    "Las nie potrzebuje pośpiechu — potrzebuje uważności.",
    "Ptak drapieżny przypomina, że wolność jest bezcenna.",
    "Łowiectwo to odpowiedzialność, nie tylko pasja.",
    "Wierność tradycji idzie w parze z troską o naturę.",
    "Cierpliwość jest pierwszym narzędziem sokolnika.",
    "Najwięcej uczy ten, kto umie uważnie patrzeć.",
    "Szacunek do zwierzyny jest miarą myśliwego.",
    "W locie sokoła spotykają się siła i precyzja.",
    "Przyroda nie jest własnością człowieka, lecz jego wspólnym domem.",
    "Dobra obserwacja bywa cenniejsza niż szybka decyzja."
  ];
  let previous = -1;
  function showQuote() {
    let next;
    do { next = Math.floor(Math.random() * quotes.length); } while (quotes.length > 1 && next === previous);
    previous = next;
    box.classList.add('quote-fading');
    window.setTimeout(() => {
      box.textContent = '„' + quotes[next] + '”';
      box.classList.remove('quote-fading');
    }, 220);
  }
  showQuote();
  window.setInterval(showQuote, 12000);
})();
</script>
