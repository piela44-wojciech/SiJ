<script>
(() => {
  const artboard = document.querySelector('.artboard');
  let restoreTimer;
  let idleTimer;
  let lastMouseY = null;
  const wakeReading = () => {
    artboard.classList.remove('idle-reading');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => artboard.classList.add('idle-reading'), 5000);
  };
  const fadeArtwork = () => {
    artboard.classList.add('reading-mode');
    clearTimeout(restoreTimer);
    restoreTimer = setTimeout(() => artboard.classList.remove('reading-mode'), 5000);
  };
  wakeReading();
  ['mousemove','wheel','scroll','pointerdown','touchstart','touchmove','keydown','click'].forEach(type => {
    window.addEventListener(type, wakeReading, { passive: true });
  });
  window.addEventListener('wheel', event => {
    if (event.deltaY > 0) fadeArtwork();
  }, { passive: true });
  window.addEventListener('scroll', fadeArtwork, { passive: true });
  window.addEventListener('mousemove', event => {
    if (lastMouseY !== null && event.clientY > lastMouseY + 2) fadeArtwork();
    lastMouseY = event.clientY;
  }, { passive: true });
  window.addEventListener('touchstart', fadeArtwork, { passive: true });
  window.addEventListener('touchmove', fadeArtwork, { passive: true });
  window.addEventListener('pointerdown', fadeArtwork, { passive: true });
  window.addEventListener('keydown', fadeArtwork);
  window.addEventListener('click', fadeArtwork);

  const menuLinks = Array.from(document.querySelectorAll('.menu-hotspots a'));
  const sections = menuLinks
     .map(link => ({ link, section: link.getAttribute('href').startsWith('#') ? document.querySelector(link.getAttribute('href')) : null })
    .filter(item => item.section);

  let clickLockUntil = 0;
  let clickedSectionId = null;

  function setActive(link) {
    menuLinks.forEach(item => {
      const active = item === link;
      item.classList.toggle('is-active', active);
      if (active) item.setAttribute('aria-current', 'location');
      else item.removeAttribute('aria-current');
    });
  }

  menuLinks.forEach(link => {
    link.addEventListener('click', () => {
      clickedSectionId = link.getAttribute('href');
      clickLockUntil = Date.now() + 2500;
      setActive(link);
    });
  });

  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver(entries => {
      if (Date.now() < clickLockUntil) return;
      const visible = entries
        .filter(entry => entry.isIntersecting)
        .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
      if (!visible) return;
      const active = sections.find(item => item.section === visible.target);
      if (active && active.link.getAttribute('href') !== '#home') {
        clickedSectionId = active.link.getAttribute('href');
        setActive(active.link);
      }
    }, { root: window.matchMedia('(max-width: 620px)').matches ? null : document.querySelector('.content-window'),
         rootMargin: '-12% 0px -58% 0px', threshold: [0, 0.1, 0.25, 0.5] });

    sections.forEach(item => observer.observe(item.section));
  }

  const initialHash = window.location.hash;
  const initialLink = menuLinks.find(link => link.getAttribute('href') === initialHash);
  if (initialLink) setActive(initialLink);
  else setActive(menuLinks.find(link => link.getAttribute('href') === '#home'));
})();
</script>
<script>
(() => {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const layer = document.createElement('div');
  layer.className = 'falling-hearts';
  layer.setAttribute('aria-hidden','true');
  document.body.appendChild(layer);
  const count = 22;
  for (let i = 0; i < count; i++) {
    const heart = document.createElement('span');
    heart.className = 'falling-heart' + (i === 7 ? ' love-note' : '');
    if (i === 7) {
      heart.innerHTML = '<span>29.09.2021</span><span>Kocham Cię</span>';
      heart.setAttribute('aria-label','29.09.2021 Kocham Cię');
    } else {
      heart.textContent = ['♥','❤','♡'][i % 3];
    }
    heart.style.left = (Math.random() * 100) + 'vw';
    heart.style.setProperty('--fall-duration', (12 + Math.random() * 16) + 's');
    heart.style.setProperty('--fall-delay', (-Math.random() * 26) + 's');
    heart.style.setProperty('--sway', (20 + Math.random() * 70) + 'px');
    heart.style.setProperty('--heart-size', (16 + Math.random() * 18) + 'px');
    layer.appendChild(heart);
  }
})();
</script>
